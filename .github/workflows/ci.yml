name: CI

# Every gate in this repo used to be opt-in: the scripts existed and passed, but
# nothing ran them on the way to production. This workflow is that enforcement.
# It needs no secrets and no database — `npm test` is deliberately made up of
# pure unit tests, and `prisma generate` (via postinstall) only reads the schema.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --legacy-peer-deps matches the Dockerfile: React 18 does not satisfy
      # every Next 16 peer range. Keep the two in step.
      - name: Install
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Split out from the rest of the suite so that a failure here is
      # unmistakable in the checks list: these are the assertions that guard
      # production data against a destructive migration.
      - name: Migration safety
        run: >-
          TS_NODE_PROJECT=tsconfig.test.json
          node --test --require ts-node/register tests/migration-safety.test.ts

      - name: Unit tests
        run: npm test

      # A migration applied to production with no directory in the repo means a
      # rebuilt environment silently differs from prod. `prisma migrate status`
      # hides this once nothing is pending, so check the tree directly.
      - name: Migration directories are committed
        run: node scripts/check-migration-manifest.mjs

      # Between 2026-07-16 and 2026-08-03 the tree quietly accumulated a critical
      # next-auth advisory, nine Next.js advisories, four libvips CVEs through
      # sharp, and a postcss file-read issue. `npm audit` had been reporting all
      # of them the whole time to anyone who ran it by hand. These two gates are
      # what makes that impossible to miss again.
      #
      # Both need registry access. `npm ci` above already needs it, so this adds
      # no new requirement.
      - name: Dependency advisories
        run: node scripts/check-audit.mjs

      # Not the same check: npm ci catches a lockfile that disagrees with
      # package.json, this catches a lockfile that agrees but is stale — which is
      # how next-auth sat at 4.24.14 while ^4.24.7 happily allowed 4.24.15.
      - name: Dependency freshness
        run: node scripts/check-dependency-freshness.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      # Catches the failures that only appear in a production build: bad dynamic
      # imports, server/client boundary mistakes, and prerender-time throws.
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PUPPETEER_SKIP_DOWNLOAD: "1"
